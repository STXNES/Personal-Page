<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="vm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#0f1629" />
    </linearGradient>
    <pattern id="vm-grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#0078d4" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <rect width="900" height="520" fill="url(#vm-bg)" />
  <rect width="900" height="520" fill="url(#vm-grid)" />

  <!-- Outer Window Frame (VMware Workstation Pro Style) -->
  <rect x="25" y="20" width="850" height="480" rx="14" fill="#0c1220" stroke="#1c2c48" stroke-width="1.5" />
  
  <!-- VMware Header Bar -->
  <rect x="25" y="20" width="850" height="44" rx="14" fill="#111c34" />
  <circle cx="52" cy="42" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="72" cy="42" r="5.5" fill="#eab308" opacity="0.8" />
  <circle cx="92" cy="42" r="5.5" fill="#22c55e" opacity="0.8" />
  
  <text x="125" y="46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#9ca3af">DC01.corp.local [Windows Server 2022 Datacenter] - VMware Workstation 17 Pro</text>
  
  <rect x="735" y="32" width="120" height="22" rx="6" fill="#0078d4" fill-opacity="0.2" stroke="#0078d4" stroke-opacity="0.5" />
  <circle cx="748" cy="43" r="3.5" fill="#22c55e" />
  <text x="758" y="47" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#60a5fa">DOMAIN HEALTHY</text>

  <!-- Left Column: Server Roles & Active Directory Tree -->
  <g transform="translate(45, 80)">
    <rect width="320" height="400" rx="10" fill="#0f182c" stroke="#1d2e50" />
    <rect width="320" height="34" rx="10" fill="#14213d" />
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#0078d4">ACTIVE DIRECTORY HIERARCHY (CORP.LOCAL)</text>

    <!-- Tree View Structure -->
    <g transform="translate(16, 52)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#38bdf8">corp.local (Forest Functional Level 2016)</text>
      
      <!-- OU Production -->
      <text x="14" y="40" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#f8fafc">├── [OU] Production_Corp</text>
      <text x="28" y="58" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">├── [OU] IT_Administration</text>
      <text x="42" y="74" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">• SEC-IT-Admins (Tier-1)</text>
      <text x="28" y="92" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">├── [OU] Finance</text>
      <text x="42" y="108" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">• CL-FIN-01 (Domain Joined)</text>
      <text x="28" y="126" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#94a3b8">└── [OU] Operations_Planta</text>

      <!-- OU Service Accounts -->
      <text x="14" y="152" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#f8fafc">├── [OU] Service_Accounts</text>
      <text x="28" y="170" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">• srv-backup-agent (gMSA)</text>

      <!-- OU Domain Controllers -->
      <text x="14" y="196" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#f8fafc">└── [OU] Domain Controllers</text>
      <text x="28" y="214" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#60a5fa">• DC01.corp.local (192.168.10.10)</text>
    </g>

    <!-- Roles Overview Card -->
    <g transform="translate(16, 280)">
      <rect width="288" height="102" rx="7" fill="#0a101e" stroke="#1d2e50" />
      <text x="12" y="20" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="bold" fill="#60a5fa">INSTALLED SERVER ROLES</text>
      <text x="12" y="40" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">✓ Active Directory Domain Services (AD DS)</text>
      <text x="12" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">✓ DNS Server (Zonas Directa e Inversa PTR)</text>
      <text x="12" y="76" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">✓ DHCP Scope: 192.168.10.100 - 200 (Active)</text>
      <text x="12" y="94" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">✓ Hypervisor: VMware Workstation Pro (VMnet2)</text>
    </g>
  </g>

  <!-- Right Column: GPO Policies & PowerShell Diagnostics Terminal -->
  <g transform="translate(385, 80)">
    
    <!-- Top Card: Group Policy Management (GPMC) -->
    <rect width="470" height="185" rx="10" fill="#0f182c" stroke="#1d2e50" />
    <rect width="470" height="34" rx="10" fill="#14213d" />
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#0078d4">GROUP POLICY OBJECTS (GPO) ENFORCEMENT</text>
    <text x="350" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">Status: Enforced</text>

    <g transform="translate(20, 52)">
      <!-- GPO 1 -->
      <rect width="430" height="34" rx="6" fill="#14213d" stroke="#2563eb" stroke-opacity="0.4" />
      <text x="14" y="21" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">GPO_Baseline_Password_Security</text>
      <text x="245" y="21" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">Min 14 Chars · Lockout: 5 Att.</text>

      <!-- GPO 2 -->
      <rect y="42" width="430" height="34" rx="6" fill="#14213d" stroke="#2563eb" stroke-opacity="0.4" />
      <text x="14" y="63" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">GPO_BitLocker_Enterprise_XTS256</text>
      <text x="245" y="63" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">AD Recovery Backup Enabled</text>

      <!-- GPO 3 -->
      <rect y="84" width="430" height="34" rx="6" fill="#14213d" stroke="#2563eb" stroke-opacity="0.4" />
      <text x="14" y="105" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">GPO_Restrict_Removable_Storage</text>
      <text x="245" y="105" font-family="'JetBrains Mono', monospace" font-size="9" fill="#34d399">USB Deny Write Access</text>
    </g>

    <!-- Bottom Card: PowerShell Terminal Live Diagnostics -->
    <g transform="translate(0, 205)">
      <rect width="470" height="195" rx="10" fill="#080e1a" stroke="#1d2e50" />
      <rect width="470" height="28" rx="10" fill="#0e172a" />
      <text x="16" y="18" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#64748b">PowerShell 7.4 (Administrator) // DC01 - AD DS Diagnostics</text>

      <g transform="translate(16, 45)">
        <text x="0" y="12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60a5fa">PS C:\Users\Administrator&gt; Test-ComputerSecureChannel -Verbose</text>
        <text x="0" y="28" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#34d399">VERBOSE: The secure channel between local computer and corp.local is in good condition.</text>
        <text x="0" y="44" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34d399">True</text>

        <text x="0" y="68" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60a5fa">PS C:\Users\Administrator&gt; Get-ADDomainController -Identity DC01 | fl Name, IPv4Address, Domain</text>
        <text x="0" y="84" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">Name        : DC01</text>
        <text x="0" y="98" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">IPv4Address : 192.168.10.10 (Static / VMnet2)</text>
        <text x="0" y="112" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#cbd5e1">Domain      : corp.local</text>

        <text x="0" y="132" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60a5fa">PS C:\Users\Administrator&gt; <tspan fill="#ffffff" class="animate-pulse">_</tspan></text>
      </g>
    </g>

  </g>
</svg>
