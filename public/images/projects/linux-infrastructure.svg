<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-lx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080e14" />
      <stop offset="100%" stop-color="#0f1f1d" />
    </linearGradient>
    <pattern id="grid-lx" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#10b981" stroke-width="0.5" opacity="0.08" />
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg-grad-lx)" />
  <rect width="800" height="450" fill="url(#grid-lx)" />

  <!-- Frame -->
  <rect x="30" y="25" width="740" height="400" rx="12" fill="#091416" stroke="#13382f" stroke-width="1.5" />
  <rect x="30" y="25" width="740" height="40" rx="12" fill="#0d2420" />
  <circle cx="55" cy="45" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="75" cy="45" r="5" fill="#eab308" opacity="0.8" />
  <circle cx="95" cy="45" r="5" fill="#22c55e" opacity="0.8" />

  <text x="130" y="49" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">axell@infra-srv01:~ // Debian Enterprise Server · Hardened &amp; Automated</text>
  <rect x="660" y="36" width="90" height="18" rx="4" fill="#10b981" fill-opacity="0.2" />
  <text x="705" y="49" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#34d399">HARDENED</text>

  <!-- Left: Service status badges -->
  <g transform="translate(55, 85)">
    <rect width="230" height="320" rx="8" fill="#071214" stroke="#143e34" />
    <text x="15" y="25" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#34d399">SYSTEMD SERVICES</text>
    
    <rect x="15" y="40" width="200" height="50" rx="6" fill="#0c1d1a" stroke="#10b981" stroke-opacity="0.3" />
    <text x="25" y="58" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">nginx.service</text>
    <text x="25" y="75" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">● active (running) - Port 443</text>

    <rect x="15" y="100" width="200" height="50" rx="6" fill="#0c1d1a" stroke="#10b981" stroke-opacity="0.3" />
    <text x="25" y="118" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">sshd.service</text>
    <text x="25" y="135" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">● active (ed25519-only)</text>

    <rect x="15" y="160" width="200" height="50" rx="6" fill="#0c1d1a" stroke="#10b981" stroke-opacity="0.3" />
    <text x="25" y="178" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">fail2ban.service</text>
    <text x="25" y="195" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10b981">● active (3 jails running)</text>

    <rect x="15" y="220" width="200" height="85" rx="6" fill="#091815" />
    <text x="25" y="240" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#10b981">SECURITY METRICS</text>
    <text x="25" y="258" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">• UFW: Default DENY incoming</text>
    <text x="25" y="274" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">• Root login: DISABLED</text>
    <text x="25" y="290" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">• Password auth: DISABLED</text>
  </g>

  <!-- Right: Terminal Execution Window -->
  <g transform="translate(300, 85)">
    <rect width="455" height="320" rx="8" fill="#050c0e" stroke="#143e34" />
    <rect width="455" height="26" rx="8" fill="#091b17" />
    <text x="15" y="17" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">bash - /usr/local/bin/infra-backup.sh</text>

    <text x="15" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">axell@infra-srv01:~$</text>
    <text x="175" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">sudo ./infra-backup.sh --full</text>

    <text x="15" y="75" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">[+] Initializing encrypted snapshot routine at 2026-11-02 02:00:01</text>
    <text x="15" y="95" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">[+] Validating filesystem integrity (ext4 / /var / /etc)... OK</text>
    <text x="15" y="115" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">[+] Compressing archive with zstd (level 19): /backups/srv01_full.tar.zst</text>
    <text x="15" y="135" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">[+] Encrypting payload with GPG asymmetric key [STXNES-INFRA-KEY]</text>
    <text x="15" y="155" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">[+] Syncing to offsite cloud repository via rsync + SSH: 100% [4.2GB / 82MB/s]</text>
    <text x="15" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10b981">[✓] Backup completed successfully. SHA256: 9f8a...3b21 logged to syslog.</text>

    <text x="15" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">axell@infra-srv01:~$</text>
    <text x="175" y="210" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1">sudo ufw status verbose</text>
    <text x="15" y="235" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8">Status: active | Logging: on (low) | Default: deny (incoming), allow (outgoing)</text>
    <text x="15" y="255" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">2222/tcp (SSH)          ALLOW IN    Anywhere (Rate-limited via fail2ban)</text>
    <text x="15" y="272" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">443/tcp (HTTPS/TLS1.3)  ALLOW IN    Anywhere</text>
    <text x="15" y="289" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">80/tcp (HTTP)           ALLOW IN    Anywhere (Redirect to 443 HSTS)</text>
  </g>
</svg>
