<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="n8n-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18" />
      <stop offset="100%" stop-color="#141829" />
    </linearGradient>
    <pattern id="n8n-dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#ff6d5a" opacity="0.08" />
    </pattern>
  </defs>

  <rect width="900" height="520" fill="url(#n8n-bg)" />
  <rect width="900" height="520" fill="url(#n8n-dots)" />

  <!-- Outer Window Frame -->
  <rect x="25" y="20" width="850" height="480" rx="14" fill="#0d101c" stroke="#232742" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="25" y="20" width="850" height="44" rx="14" fill="#13172b" />
  <circle cx="52" cy="42" r="5.5" fill="#ef4444" opacity="0.8" />
  <circle cx="72" cy="42" r="5.5" fill="#eab308" opacity="0.8" />
  <circle cx="92" cy="42" r="5.5" fill="#22c55e" opacity="0.8" />
  
  <text x="125" y="46" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#9ca3af">hr-automation-pipeline // n8n Orchestrator · Cohere RAG · Neon DB · Telegram</text>
  
  <rect x="740" y="32" width="115" height="22" rx="6" fill="#ff6d5a" fill-opacity="0.2" stroke="#ff6d5a" stroke-opacity="0.5" />
  <circle cx="754" cy="43" r="3.5" fill="#22c55e" />
  <text x="765" y="47" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#ff8a7a">WORKFLOW ACTIVE</text>

  <!-- Left: n8n Workflow Canvas -->
  <g transform="translate(45, 80)">
    <rect width="470" height="400" rx="10" fill="#111424" stroke="#1f243d" />
    <rect width="470" height="34" rx="10" fill="#161a30" />
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ff6d5a">n8n AUTOMATION WORKFLOW</text>
    <text x="360" y="22" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Execution #1249</text>

    <!-- Node 1: Telegram Webhook -->
    <g transform="translate(25, 60)">
      <rect width="180" height="60" rx="8" fill="#181c35" stroke="#0ea5e9" stroke-width="1.5" />
      <rect x="10" y="12" width="36" height="36" rx="6" fill="#0284c7" fill-opacity="0.2" />
      <!-- Paper plane icon -->
      <path d="M18 30 L32 20 L24 34 L21 28 Z" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linejoin="round" />
      <text x="54" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">Telegram Trigger</text>
      <text x="54" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#38bdf8">Inbound Webhook</text>
      <!-- Connector -->
      <circle cx="180" cy="30" r="4.5" fill="#0ea5e9" />
    </g>

    <!-- Path connecting Node 1 to Node 2 -->
    <path d="M 205 90 C 240 90, 240 90, 275 90" stroke="#38bdf8" stroke-width="2" fill="none" />

    <!-- Node 2: Cohere Embeddings RAG -->
    <g transform="translate(275, 60)">
      <rect width="170" height="60" rx="8" fill="#181c35" stroke="#8567fa" stroke-width="1.5" />
      <rect x="10" y="12" width="36" height="36" rx="6" fill="#8567fa" fill-opacity="0.2" />
      <!-- Brain/chip icon -->
      <path d="M22 22 L34 22 M22 28 L34 28 M22 34 L34 34 M28 18 L28 38" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round" />
      <text x="54" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">Cohere RAG</text>
      <text x="54" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#a78bfa">Multilingual Vector</text>
      <circle cx="85" cy="60" r="4.5" fill="#8567fa" />
    </g>

    <!-- Path connecting Node 2 down to Node 3 -->
    <path d="M 360 120 C 360 145, 115 145, 115 175" stroke="#8567fa" stroke-width="2" fill="none" />

    <!-- Node 3: Neon PostgreSQL Database -->
    <g transform="translate(25, 175)">
      <rect width="180" height="60" rx="8" fill="#181c35" stroke="#00e599" stroke-width="1.5" />
      <rect x="10" y="12" width="36" height="36" rx="6" fill="#00e599" fill-opacity="0.15" />
      <!-- DB cylinder icon -->
      <ellipse cx="28" cy="24" rx="8" ry="3.5" fill="none" stroke="#00e599" stroke-width="1.5" />
      <path d="M20 24 L20 34 C20 36 36 36 36 34 L36 24" fill="none" stroke="#00e599" stroke-width="1.5" />
      <text x="54" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">Neon PostgreSQL</text>
      <text x="54" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#00e599">Verify Employee #</text>
      <circle cx="180" cy="30" r="4.5" fill="#00e599" />
    </g>

    <!-- Path connecting Node 3 to Node 4 -->
    <path d="M 205 205 C 240 205, 240 205, 275 205" stroke="#00e599" stroke-width="2" fill="none" />

    <!-- Node 4: PDF Document Generator -->
    <g transform="translate(275, 175)">
      <rect width="170" height="60" rx="8" fill="#181c35" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="10" y="12" width="36" height="36" rx="6" fill="#f59e0b" fill-opacity="0.15" />
      <!-- PDF Document icon -->
      <rect x="22" y="20" width="12" height="18" rx="2" fill="none" stroke="#fbbf24" stroke-width="1.5" />
      <path d="M25 25 L31 25 M25 29 L29 29" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" />
      <text x="54" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">PDF Certificate</text>
      <text x="54" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#fbbf24">Digital Signature</text>
      <circle cx="85" cy="60" r="4.5" fill="#f59e0b" />
    </g>

    <!-- Path connecting Node 4 to Node 5 -->
    <path d="M 360 235 C 360 260, 205 260, 205 285" stroke="#f59e0b" stroke-width="2" fill="none" />

    <!-- Node 5: Dispatcher to Telegram & Email -->
    <g transform="translate(115, 285)">
      <rect width="240" height="60" rx="8" fill="#181c35" stroke="#ff6d5a" stroke-width="1.5" />
      <rect x="10" y="12" width="36" height="36" rx="6" fill="#ff6d5a" fill-opacity="0.2" />
      <!-- Send arrow icon -->
      <path d="M19 30 L32 20 L27 34 L23 30 Z" fill="none" stroke="#ff6d5a" stroke-width="1.5" />
      <text x="56" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">Telegram &amp; Email Dispatch</text>
      <text x="56" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#34d399">✓ 200 OK (Latency: 1.14s)</text>
    </g>

    <!-- Realtime Execution Terminal footer inside n8n -->
    <rect x="20" y="360" width="430" height="26" rx="5" fill="#0b0d18" />
    <text x="32" y="377" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Execution log: [SUCCESS] Payload routed to Neon DB &amp; Telegram in 1,142ms</text>
  </g>

  <!-- Right: Real Telegram Client Interaction Mockup -->
  <g transform="translate(535, 80)">
    <rect width="320" height="400" rx="10" fill="#0f1322" stroke="#1f263f" />
    
    <!-- Telegram Chat Header -->
    <rect width="320" height="48" rx="10" fill="#171e33" />
    <circle cx="28" cy="24" r="14" fill="#0ea5e9" />
    <path d="M22 26 L30 20 L26 29 L24 26 Z" fill="none" stroke="#ffffff" stroke-width="1.5" />
    <text x="50" y="22" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" fill="#ffffff">HR Assistant Bot</text>
    <text x="50" y="36" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#34d399">● bot oficial · online 24/7</text>

    <!-- User Inbound Message Bubble -->
    <g transform="translate(45, 66)">
      <rect width="255" height="50" rx="8" fill="#2b3b5c" stroke="#3b82f6" stroke-opacity="0.3" />
      <text x="14" y="22" font-family="sans-serif" font-size="11.5" fill="#f8fafc">Hola, requiero mi constancia</text>
      <text x="14" y="38" font-family="sans-serif" font-size="11.5" fill="#f8fafc">salarial para trámite bancario.</text>
      <text x="215" y="42" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">14:02</text>
    </g>

    <!-- Bot Response Bubble -->
    <g transform="translate(20, 130)">
      <rect width="280" height="210" rx="8" fill="#151b2e" stroke="#2a3352" />
      <text x="14" y="24" font-family="sans-serif" font-size="11.5" fill="#f1f5f9">¡Hola Juan! Identidad verificada:</text>
      <text x="14" y="42" font-family="'JetBrains Mono', monospace" font-size="10" fill="#34d399">✓ Empleado #10842 (Operaciones)</text>
      <text x="14" y="62" font-family="sans-serif" font-size="11" fill="#cbd5e1">He generado tu constancia oficial con</text>
      <text x="14" y="78" font-family="sans-serif" font-size="11" fill="#cbd5e1">firma digital y código de validación QR:</text>

      <!-- Attached PDF Box -->
      <g transform="translate(14, 94)">
        <rect width="252" height="64" rx="6" fill="#0d111e" stroke="#ff6d5a" stroke-width="1.2" />
        <rect x="10" y="12" width="38" height="40" rx="4" fill="#ff6d5a" fill-opacity="0.15" />
        <rect x="22" y="20" width="14" height="20" rx="2" fill="none" stroke="#ff6d5a" stroke-width="1.5" />
        <text x="56" y="28" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#f8fafc">Constancia_Salarial.pdf</text>
        <text x="56" y="44" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#94a3b8">245 KB · Firma Digital OK</text>
      </g>

      <!-- Action Button inside message -->
      <rect x="14" y="168" width="252" height="30" rx="5" fill="#0284c7" fill-opacity="0.25" stroke="#0284c7" stroke-width="1" />
      <text x="140" y="188" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold" fill="#38bdf8">DESCARGAR DOCUMENTO ↗</text>
    </g>

    <!-- Chat input mock -->
    <rect x="15" y="355" width="290" height="34" rx="6" fill="#0a0d18" stroke="#1f263f" />
    <text x="25" y="376" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b">Escribe un comando o consulta...</text>
  </g>
</svg>
